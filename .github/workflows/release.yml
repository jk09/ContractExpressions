# Publishes ContractCheck, ContractCheck.FsCheck and ContractCheck.DependencyInjection to nuget.org when a version tag
# (v1.2.3, v1.2.3-preview.1) is pushed. Needs the repository secret NUGET_API_KEY: a nuget.org API key allowed to push
# ContractCheck*.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build ContractExpressions.sln -c Release -p:TestAllFrameworks=true -p:Version=${{ steps.version.outputs.version }}

      - name: Test (net8.0, net9.0, net10.0)
        run: dotnet test ContractExpressions.sln -c Release --no-build -p:TestAllFrameworks=true -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack ContractExpressions.sln -c Release --no-build -p:TestAllFrameworks=true -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

      # The only step that sees the secret. dotnet nuget push also pushes each .snupkg next to its .nupkg.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Add the repository secret NUGET_API_KEY (a nuget.org API key with push rights for ContractCheck*)"
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
